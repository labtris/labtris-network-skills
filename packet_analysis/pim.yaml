name: PIM multicast routing
description: >
  Whether multicast routers are building the tree they should.
protocol_key: pim
display_filter: pim
fields:
  - label: "Frame Number"
    tshark_field: frame.number
    description: "Position in the capture"
  - label: "Source"
    tshark_field: ip.src
    description: "Sending address"
  - label: "Destination"
    tshark_field: ip.dst
    description: "Receiving address"
  - label: "Type"
    tshark_field: pim.type
    description: "0 hello, 1 register, 3 join/prune, 4 bootstrap"
checks:
  - name: hellos-no-joins
    when: "type 0 only"
    means: >
      Neighbours exist but nothing is requesting traffic, so no tree is
      built.
    next: "Check that a receiver has actually joined a group with IGMP"
  - name: registers-repeating
    when: "type 1 repeating"
    means: >
      The source is registering to the RP and not being switched to a
      shortest-path tree.
    next: "Check the RP is reachable and correct on every router"
